<script>
(function () {
  var m = location.pathname.match(/r\/([A-Za-z0-9]{6})\/?$/);

    location.replace(location.pathname.replace(/r\/[A-Za-z0-9]{6}\/?$/, 'slave.html?v=2#room=' + m[1].toUpperCase()));

    location.replace(location.pathname.replace(/\/[^\/]*$/, '/') + 'index.html');
  }
})();
